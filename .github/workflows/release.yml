name: release

# Publishes v<package.json version> from a master commit CI passed. Cut the tag locally with
# `npx plugin-kit release <version>` on a green master, push it, and this workflow builds, checks and publishes the
# GitHub release. Agents never approve or cut a release; the maintainer does.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: npm ci --ignore-scripts
      - name: The tag is the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "$TAG" = "v$version" ] || { echo "::error::$TAG is not v$version"; exit 1; }
      - name: Check
        run: node scripts/check.mjs typecheck build unit kit conformance
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          node_modules/.bin/plugin-kit conformance --json > "$RUNNER_TEMP/release/conformance-report.json"
          find "$RUNNER_TEMP/release" -type f ! -name SHA256SUMS | sed "s#^$RUNNER_TEMP/release/##" | sort > "$RUNNER_TEMP/files.txt"
          (cd "$RUNNER_TEMP/release" && while IFS= read -r file; do sha256sum "$file"; done < "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/release/SHA256SUMS"
          cat "$RUNNER_TEMP/release/SHA256SUMS"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$RUNNER_TEMP"/release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file CHANGELOG.md

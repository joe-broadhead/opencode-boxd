# Publishes a v<version> tag to npm with trusted publishing (OIDC) and provenance. The guard runs before the release
# environment, so a private package or a mismatched tag never waits for approval. The publish job runs after a reviewer
# approves the release environment: it packs the checked tree and tests that exact tarball before it publishes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a private package or a tag that differs from the version
        run: |
          # shellcheck disable=SC2016
          node -e '
            const manifest = require("./package.json")
            const tag = process.env.GITHUB_REF_NAME
            if (manifest.private === true) { console.error("package.json is private"); process.exit(1) }
            if (tag !== `v${manifest.version}`) { console.error(`tag ${tag} does not match version ${manifest.version}`); process.exit(1) }
          '

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Check npm supports trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("npm " + process.argv[1] + " is older than 11.5.1, which trusted publishing needs")
              process.exit(1)
            }
          ' "$(npm --version)"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Pack
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tarballs=("$RUNNER_TEMP"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "Expected exactly one package tarball" >&2
            exit 1
          fi
      - name: Test the tarball that will be published
        run: PACK_TARBALL="$(ls "$RUNNER_TEMP"/*.tgz)" bun test ./test/pack
      - name: Publish with provenance
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          # A 404 means the version is not on npm yet; any other failure stops the release.
          if published="$(npm view "$name@$version" version 2>"$RUNNER_TEMP/npm-view.log")"; then
            if [ "$published" = "$version" ]; then
              echo "::notice::$name@$version is already on npm; nothing to publish."
              exit 0
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
            cat "$RUNNER_TEMP/npm-view.log"
            echo "::error::Could not check whether $name@$version is already on npm."
            exit 1
          fi
          npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public

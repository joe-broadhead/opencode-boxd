name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a run by hand on master never cancels the push run a release stands on.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job runs the whole check. A pull request from a fork runs the public runner: it has no access to the
  # organisation's private runners or secrets, and its head repository is not this one.
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - run: npm ci --ignore-scripts
      # actionlint parses the workflows as workflows, not as YAML: a `${{ }}` in a context that does not exist makes
      # GitHub reject the file and run nothing at all. The download is checked against its published checksums, and
      # `npm run check` lints the workflows again through its own actionlint stage.
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -color .github/workflows/ci.yml .github/workflows/release.yml
      # The stock binaries the prover and pack stages run against, so the import-id evidence runs here too: one for each
      # release in TESTED_HOSTS (src/constants.ts), read by scripts/tested-hosts.mjs as the release workflow reads it.
      - name: Stock OpenCode binaries
        run: |
          platform="$(node -p 'process.platform')-$(node -p 'process.arch')"
          hosts="$(node scripts/tested-hosts.mjs)"
          for version in $(node -p 'JSON.parse(process.argv[1].replace(/^hosts=/, "")).join(" ")' "$hosts"); do
            dir="$RUNNER_TEMP/stock-$version"
            mkdir -p "$dir"
            (cd "$dir" && npm init -y >/dev/null && npm install "@opencode/cli@$version" "@opencode/cli-$platform@$version" --omit=optional --ignore-scripts --no-audit --no-fund)
            echo "OPENCODE_BIN_${version//./_}=$dir/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"
          done
      - run: npm run check
